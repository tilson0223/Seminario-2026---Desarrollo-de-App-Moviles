 <ion-header>
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-menu-button></ion-menu-button>
      </ion-buttons>
      <ion-title>Home</ion-title>
    </ion-toolbar>
  </ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Inicio</ion-title>
    </ion-toolbar>
  </ion-header>

  <swiper-container
  slides-per-view="4"
  space-between="10"
  pagination="true"
  loop="true"
>

<swiper-slide *ngFor="let album of albums" (click)="showSongs(album.id)">
    <div class="slide-content">
      <img [src]="album.image"/>
      <p>{{ album.name }}</p>
    </div>
</swiper-slide> 
</swiper-container>

<!--mostrar un swiper o lista con los artistas del servidor y al darle clic muestre las cacnciones de ese artista -->
</ion-content>

<ion-footer>
<ion-grid>
  <ion-row>
    <ion-col class="ion-text-start">{{ formatTime(currentSong?.currentTime) || "0:00"}}</ion-col>
    <ion-col class="ion-text-end">{{formatTime(getRemainingTime()) || "0:00"}}</ion-col>
  </ion-row>  
</ion-grid>
<ion-progress-bar [value]="newTime"></ion-progress-bar>
<ion-row>
    <ion-col size="1">
    <ion-icon name="heart"></ion-icon>
   </ion-col>
   <ion-col size="10">
    <ion-text>{{
      song.name || "Selecciona una canción"
    }}</ion-text>
   </ion-col>
  <ion-col size="1">
    <ion-icon name="play" *ngIf="!song.playing" (click)=play()></ion-icon>
     <ion-icon name="pause" *ngIf="song.playing" (click)=pause()></ion-icon>
  </ion-col>
  </ion-row>

</ion-footer>
